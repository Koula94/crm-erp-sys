# Database Configuration
# Database Configuration - Using H2 in-memory database for testing
# For production, replace with your PostgreSQL credentials:
# spring.datasource.url=jdbc:postgresql://your-neon-host:5432/your-database
# spring.datasource.username=your-username
# spring.datasource.password=your-password
# spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:3001
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging
logging.level.com.kadimar.erp=DEBUG
logging.level.org.springframework.web=DEBUG